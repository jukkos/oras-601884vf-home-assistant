substitutions:
  device_name: oras-venttiili
  friendly_name: "Oras Venttiili"
  pulse_duration: 16ms
  wake_delay: 2ms
  settle_delay: 2ms
  command_lockout: 1500ms
  remote_command_lockout: 5s
  local_button_boot_lockout: 3s

packages:
  logic: !include oras_venttiili_logic.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 5min
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret oras_venttiili_fallback_ap_password

captive_portal:

api:
  reboot_timeout: 0s
  encryption:
    key: !secret oras_venttiili_api_encryption_key
  actions:
    - action: avaa
      then:
        - script.execute:
            id: valve_drive
            open_direction: true
            local_command: false
    - action: sulje
      then:
        - script.execute:
            id: valve_drive
            open_direction: false
            local_command: false
  on_client_connected:
    then:
      - lambda: |-
          id(remote_command_guard_active) = true;
          ESP_LOGI("oras_venttiili", "API client connected: %s", client_info.c_str());
      - script.execute: publish_valve_state
      - script.execute: remote_command_guard_timer

ota:
  - platform: esphome
    password: !secret oras_venttiili_ota_password

safe_mode:

binary_sensor:
  - platform: status
    name: "Yhteys"
    entity_category: diagnostic

sensor:
  - platform: wifi_signal
    name: "WiFi signaali"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Kaynnissaoloaika"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP-osoite"
      entity_category: diagnostic
    ssid:
      name: "WiFi SSID"
      entity_category: diagnostic
    bssid:
      name: "WiFi BSSID"
      entity_category: diagnostic
